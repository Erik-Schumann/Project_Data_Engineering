# Kafka Streams' own internals log a lot at INFO (rebalances, state store
# restores, etc.) - kept at WARN so "docker compose logs -f
# watch-summary-service" stays readable; this app's own topology stays at
# the root INFO level.
status = error
name = WatchSummaryConfig

appender.console.type = Console
appender.console.name = console
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss} %-5level %logger{1} - %msg%n

rootLogger.level = info
rootLogger.appenderRef.console.ref = console

logger.kafka.name = org.apache.kafka
logger.kafka.level = warn

logger.streams.name = org.apache.kafka.streams
logger.streams.level = info
