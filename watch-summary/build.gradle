// Kafka Streams job - the one genuine stream-processing service in this
// project (everything else is Python: a direct producer in client-input,
// plain scheduled SQL in reporting-output). No Avro codegen plugin here
// on purpose - GenericRecord + the local .avsc files under schemas/ is
// the same no-codegen approach every other service in this repo uses.
plugins {
    id 'application'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

repositories {
    mavenCentral()
    maven { url 'https://packages.confluent.io/maven/' }
}

// Matches CONFLUENT_VERSION (7.6.1, see ../.env.example) -> Apache Kafka 3.6.1.
dependencies {
    implementation 'org.apache.kafka:kafka-streams:3.6.1'
    implementation 'io.confluent:kafka-streams-avro-serde:7.6.1'
    // Kafka's own logging is via slf4j-api only (no backend bundled) -
    // without one, "docker compose logs" shows nothing. log4j-slf4j-impl
    // (not -slf4j2-impl) matches Kafka 3.6.x's slf4j-api 1.7.x.
    runtimeOnly 'org.apache.logging.log4j:log4j-core:2.23.1'
    runtimeOnly 'org.apache.logging.log4j:log4j-slf4j-impl:2.23.1'
    // NOT using io.factorhouse:kpow-streams-agent here: kPow's Kafka
    // Streams view is Enterprise-only (this stack runs kpow-ce) - tried
    // it 2026-08-12, confirmed via docs.factorhouse.io it can't render
    // under Community Edition regardless of client-side registration, and
    // removed rather than keep a dependency + extra topic + per-minute
    // produce call that earns nothing under this license.

    // TopologyTestDriver runs the topology in-memory against fake input/
    // output topics - no broker, no Docker Compose stack needed to test
    // the session-window/reduce/suppress logic. kafka-streams-avro-serde's
    // mock:// schema registry URL scheme (see AppTest) needs no separate
    // test dependency - it's already transitively on this classpath via
    // kafka-schema-registry-client.
    testImplementation 'org.apache.kafka:kafka-streams-test-utils:3.6.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'de.iu.watchsummary.App'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// A separate source set/task, not folded into `test` - mirrors reporting-
// output's pytest `integration` marker being opt-in (`pytest -m integration`,
// not the plain `pytest -m "not integration"` default): `gradle test`/`gradle
// build` must stay usable with no infra running at all, so anything that
// needs a real broker + Schema Registry lives here instead, run explicitly
// via `gradle integrationTest` (see AppIntegrationTest and README.md's
// "Tests" section for what "real" means here).
sourceSets {
    integrationTest {
        java.srcDir 'src/integrationTest/java'
        compileClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
        runtimeClasspath += output + compileClasspath
    }
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

tasks.register('integrationTest', Test) {
    description = 'Runs AppIntegrationTest against a real Kafka + Schema Registry (docker compose up -d kafka schema-registry kafka-init first).'
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    useJUnitPlatform()
    // Not part of `check`/`build` - see the sourceSets comment above.
    shouldRunAfter test
}

test {
    useJUnitPlatform()
}

// shadowJar bundles kafka-streams/avro-serde into one runnable jar so the
// runtime image (see Dockerfile) doesn't need a dependency-resolution step.
shadowJar {
    archiveBaseName = 'watch-summary'
    archiveClassifier = 'all'
    mergeServiceFiles()
}
