[pytest]
testpaths = tests
markers =
    integration: needs the real docker-compose stack up (Kafka, Schema Registry, Connect, reporting-db) - run `docker compose up -d` first (test_sql_jobs_integration.py only needs reporting-db itself). Every test here is integration-marked: the SQL jobs' real logic lives in SQL strings only meaningfully testable against a live Postgres (test_sql_jobs_integration.py), and the connector configs are only meaningfully testable against a live Kafka Connect (test_connector_dlq_integration.py) - so there's no unit-testable surface here the way client-input/catalog-input have.
