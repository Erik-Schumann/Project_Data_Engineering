[pytest]
testpaths = tests
markers =
    integration: needs the real docker-compose stack up (Kafka, Schema Registry, Connect, reporting-db) - run `docker compose up -d` first. These are the only tests reporting-output has: the SQL jobs are ~100% IO glue with the real logic living in SQL strings, and the connector configs are only meaningfully testable against a live Kafka Connect + Postgres, so there's no unit-testable surface here the way client-input/catalog-input have.
