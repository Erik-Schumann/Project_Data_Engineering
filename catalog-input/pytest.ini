[pytest]
; app.py imports seed_catalog directly (Dockerfile bundles both into one
; image, build context is catalog-input/ - see frontend/Dockerfile) - both
; directories need to be importable for tests to mirror that.
pythonpath = frontend seed
testpaths = tests
markers =
    integration: needs the real docker-compose stack up (catalog-db) - run `docker compose up -d catalog-db` first. test_app_routes.py drives app.py's actual Flask routes against a real Postgres, unlike test_app_forms.py/test_seed_catalog.py's pure-function unit tests - see tests/conftest.py's docstring.
