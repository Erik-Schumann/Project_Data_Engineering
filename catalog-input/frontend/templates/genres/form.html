{% extends "base.html" %}
{% block title %}Add Genre — Catalog Admin{% endblock %}

{% block content %}
<div class="pt-3 pb-2 mb-3 border-bottom">
  <h1 class="h2"><i class="bi bi-tags me-2"></i>Add genre</h1>
</div>

<form method="post" style="max-width: 30rem;">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="mb-3">
    <label class="form-label">Name</label>
    <input type="text" name="name" class="form-control" maxlength="50" value="{{ genre.name or '' }}" required autofocus>
  </div>
  <button type="submit" class="btn btn-primary">
    <i class="bi bi-check-lg me-1"></i>Add genre
  </button>
  <a href="{{ url_for('genres_list') }}" class="btn btn-link">Cancel</a>
</form>
{% endblock %}
