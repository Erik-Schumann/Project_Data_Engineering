{% extends "base.html" %}
{% block title %}Add Language — Catalog Admin{% endblock %}

{% block content %}
<div class="pt-3 pb-2 mb-3 border-bottom">
  <h1 class="h2"><i class="bi bi-globe2 me-2"></i>Add language</h1>
</div>

<form method="post" style="max-width: 30rem;">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="mb-3">
    <label class="form-label">Code <span class="text-muted small">(e.g. en)</span></label>
    <input type="text" name="code" class="form-control" maxlength="10" value="{{ code or '' }}" required autofocus>
  </div>
  <button type="submit" class="btn btn-primary">
    <i class="bi bi-check-lg me-1"></i>Add language
  </button>
  <a href="{{ url_for('countries_languages_list') }}" class="btn btn-link">Cancel</a>
</form>
{% endblock %}
