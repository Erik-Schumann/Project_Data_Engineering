<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Catalog Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    /* Adapted from the Bootstrap 5.3 "Sign-in" example (getbootstrap.com/docs/5.3/examples/sign-in/) */
    body {
      display: flex;
      align-items: center;
      padding-top: 40px;
      padding-bottom: 40px;
      background-color: #f5f5f5;
    }
    .form-signin {
      width: 100%;
      max-width: 380px;
      padding: 15px;
      margin: auto;
    }
    .form-signin .bi-collection-play { font-size: 3rem; }
  </style>
</head>
<body>
  <main class="form-signin">
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="text-center mb-3">
        <i class="bi bi-collection-play text-primary"></i>
        <h1 class="h3 mb-1 fw-normal">Catalog Admin</h1>
        <p class="text-muted small">Sign in to manage the catalog</p>
      </div>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert alert-{{ 'danger' if category == 'danger' else category }}" role="alert">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <div class="form-floating">
        <input type="text" name="username" class="form-control" id="username" placeholder="Username" required autofocus>
        <label for="username">Username</label>
      </div>
      <div class="form-floating mt-2">
        <input type="password" name="password" class="form-control" id="password" placeholder="Password" required>
        <label for="password">Password</label>
      </div>

      <button class="w-100 btn btn-lg btn-primary mt-3" type="submit">Sign in</button>
      <p class="mt-4 mb-0 text-muted text-center small">Catalog Input Service &middot; local dev only</p>
    </form>
  </main>
</body>
</html>
